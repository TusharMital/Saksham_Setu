openapi: 3.0.3
info:
  title: Saksham Setu API
  description: Backend APIs for Saksham Setu (साक्षम सेतु) GovTech loan recommendation platform.
  version: 1.0.0
paths:
  /api/recommend/:
    post:
      summary: Recommend schemes based on applicant criteria
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: List of accepted (scored) and rejected schemes.
  /api/schemes/:
    get:
      summary: Retrieve all Central, State, and NSFDC loan schemes with optional filtering and sorting
      parameters:
        - name: q
          in: query
          schema:
            type: string
        - name: level
          in: query
          schema:
            type: string
            enum: [central, state]
        - name: state
          in: query
          schema:
            type: string
        - name: state_exclusive
          in: query
          schema:
            type: boolean
        - name: category
          in: query
          schema:
            type: string
        - name: women_only
          in: query
          schema:
            type: boolean
        - name: sector
          in: query
          schema:
            type: string
        - name: channel
          in: query
          schema:
            type: string
        - name: desired_loan
          in: query
          schema:
            type: number
        - name: max_rate
          in: query
          schema:
            type: number
        - name: income
          in: query
          schema:
            type: number
        - name: sort
          in: query
          schema:
            type: string
      responses:
        '200':
          description: All matching schemes in the catalog with full metadata including subsidy_note.
  /api/schemes/{code}/:
    get:
      summary: Retrieve full enriched metadata and EMI amortization breakdown for a scheme
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
        - name: amount
          in: query
          required: false
          schema:
            type: number
      responses:
        '200':
          description: Enriched scheme metadata, available_channels, documents, notes, and yearly EMI schedule.
        '404':
          description: Scheme not found.
  /api/branches/:
    get:
      summary: Retrieve ranked partner branches by location and scheme
      parameters:
        - name: scheme
          in: query
          schema:
            type: string
        - name: lat
          in: query
          schema:
            type: number
        - name: lng
          in: query
          schema:
            type: number
        - name: pin
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Ranked branches with health checks.
  /api/banks/live-search/:
    get:
      summary: Live scheme-driven search for nearby bank branches (Overpass/Nominatim) and official portals
      parameters:
        - name: scheme
          in: query
          schema:
            type: string
        - name: pin
          in: query
          schema:
            type: string
        - name: lat
          in: query
          schema:
            type: number
        - name: lng
          in: query
          schema:
            type: number
        - name: radius_km
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: Resolved coordinates, nearby live/directory branches, official portals, provided_schemes, and all_branches.
        '400':
          description: Missing or invalid location parameters.
        '404':
          description: Scheme not found.
  /api/emi/:
    post:
      summary: Calculate loan EMI and amortization schedule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: EMI calculation and amortization schedule.
  /api/applications/:
    post:
      summary: Create a new loan application draft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: Created application.
  /api/applications/{ref}/:
    get:
      summary: Get application status and timeline by reference number
      parameters:
        - name: ref
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Application details and timeline.
        '404':
          description: Application not found.
  /api/applications/{ref}/pdf/:
    get:
      summary: Download summary PDF for an application
      parameters:
        - name: ref
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: ReportLab PDF stream.
  /api/chat/:
    post:
      summary: Send query to Sarthi chatbot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message:
                  type: string
                history:
                  type: array
                language:
                  type: string
      responses:
        '200':
          description: Assistant reply with reply_sig and language metadata.
        '400':
          description: Validation error.
        '429':
          description: Rate limited.
        '503':
          description: Chat service or scheme data temporarily unavailable.
  /api/pin-lookup/:
    get:
      summary: Look up latitude/longitude by PIN code
      parameters:
        - name: pin
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Coordinates and place name.
        '404':
          description: PIN not found.
  /api/verify-category/:
    post:
      summary: Verify social category, document match, Article 341 state notification, and DoPT EWS rules (localized by lang)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                loan_state:
                  type: string
                certificate_state:
                  type: string
                category:
                  type: string
                certificate_type:
                  type: string
                sub_caste:
                  type: string
                annual_income:
                  type: number
                ews_assets_compliant:
                  type: boolean
                lang:
                  type: string
      responses:
        '200':
          description: Localized verification status, citation, message, and next_step.
  /api/i18n/languages/:
    get:
      summary: List all 23 supported languages with script, RTL/LTR direction, and speech_locale metadata
      responses:
        '200':
          description: Supported languages registry (23 languages).
  /api/i18n/{lang_code}/:
    get:
      summary: Retrieve sanitized static UI translation bundle for a language code with ETag/Cache-Control
      parameters:
        - name: lang_code
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Language metadata and full UI translation dictionary.
        '304':
          description: Not Modified (matching ETag).
        '404':
          description: Unsupported language code.
  /api/i18n/translate-schemes/:
    post:
      summary: Translate dynamic scheme fields using persistent cache and Groq fallback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lang]
              properties:
                lang:
                  type: string
                scheme_codes:
                  type: array
                  items:
                    type: string
                  nullable: true
      responses:
        '200':
          description: Returns language, total_schemes, translations, cached_count, translated_count, and fallback_count.
        '400':
          description: Invalid or missing language code.
